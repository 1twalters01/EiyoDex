[package]
name = "identity"
version = "0.1.0"
edition = "2021"

[features]
default = ["uuid"]
uuid = ["dep:uuid"]
ulid = ["dep:ulid"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", optional = true, features = ["derive"] }
ulid = { version = "1", optional = true }
uuid = { version = "1.8.0", optional = true, features = ["v4", "fast-rng", "macro-diagnostics", "serde"] }

thiserror = "2.0.18"